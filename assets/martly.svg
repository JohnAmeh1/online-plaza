<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- Define gradient matching your code: from-green-400 to-blue-500 -->
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square with gradient -->
  <rect x="50" y="50" width="300" height="300" rx="48" ry="48" 
        fill="url(#brandGradient)" 
        filter="url(#shadow)"/>
  
  <!-- Store icon in white -->
  <g transform="translate(200, 200)" fill="white">
    <!-- Awning/roof -->
    <path d="M -60 -50 L -70 -30 L 70 -30 L 60 -50 Z" />
    
    <!-- Awning stripes for detail -->
    <path d="M -60 -50 L -65 -35 M -40 -50 L -48 -35 M -20 -50 L -30 -35 M 0 -50 L -12 -35 M 20 -50 L 6 -35 M 40 -50 L 24 -35 M 60 -50 L 42 -35" 
          stroke="rgba(255,255,255,0.3)" 
          stroke-width="3" 
          fill="none"/>
    
    <!-- Store front -->
    <rect x="-70" y="-30" width="140" height="100" />
    
    <!-- Door -->
    <rect x="-20" y="10" width="40" height="60" fill="rgba(59,130,246,0.3)"/>
    <circle cx="10" cy="45" r="3" fill="rgba(59,130,246,0.5)"/>
    
    <!-- Left window -->
    <rect x="-55" y="-10" width="25" height="30" fill="rgba(74,222,128,0.3)"/>
    <line x1="-42.5" y1="-10" x2="-42.5" y2="20" stroke="white" stroke-width="2"/>
    <line x1="-55" y1="5" x2="-30" y2="5" stroke="white" stroke-width="2"/>
    
    <!-- Right window -->
    <rect x="30" y="-10" width="25" height="30" fill="rgba(74,222,128,0.3)"/>
    <line x1="42.5" y1="-10" x2="42.5" y2="20" stroke="white" stroke-width="2"/>
    <line x1="30" y1="5" x2="55" y2="5" stroke="white" stroke-width="2"/>
    
    <!-- Base/foundation -->
    <rect x="-70" y="70" width="140" height="8" fill="rgba(255,255,255,0.9)"/>
  </g>
</svg>